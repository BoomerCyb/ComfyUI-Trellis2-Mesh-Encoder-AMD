[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ComfyUI-Trellis2-Mesh-Encoder"
version = "1.0.0"
description = "ComfyUI custom node for TRELLIS.2 encoding and mesh output"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
dependencies = [
    "numpy>=1.24",
    "trimesh>=4.0",
    "safetensors>=0.4",
]

[project.urls]
Repository = "https://github.com/Mstafa-awad/Trellis2-Mesh-Encoder"

[tool.setuptools]
py-modules = ["mesh_encoder"]
